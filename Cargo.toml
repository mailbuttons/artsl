[package]
name = "artsl"
version = "0.1.0"
edition = "2021"
description = "Console art that rolls across your terminal, drawn by an LLM from today's news. A homage to sl."
license = "MIT"
repository = "https://github.com/mailbuttons/artsl"
keywords = ["cli", "ascii-art", "terminal", "sl", "news"]
categories = ["command-line-utilities"]

[[bin]]
name = "artsl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
dirs = "5"
hex = "0.4"
quick-xml = "0.37"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal"] }
toml = "0.8"
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true
