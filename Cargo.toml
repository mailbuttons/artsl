[package]
name = "artsl"
version = "0.1.0"
edition = "2021"
description = "Console art that rolls across your terminal, drawn by an LLM from today's news. A homage to sl."
license = "MIT"
rust-version = "1.88"
readme = "README.md"
exclude = ["/.github", "/deploy", "/docs", "/examples/*.png"]
repository = "https://github.com/mailbuttons/artsl"
keywords = ["cli", "ascii-art", "terminal", "sl", "news"]
categories = ["command-line-utilities"]

[[bin]]
name = "artsl"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"
clap_mangen = "0.2"
crossterm = "0.29"
dirs = "5"
hex = "0.4"
quick-xml = "0.41"
rand = "0.9"
redb = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "fs", "signal"] }
toml = "0.8"
tower-http = { version = "0.6", features = ["trace", "timeout", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
unicode-width = "0.2"

[profile.release]
lto = true
codegen-units = 1
strip = true

[package.metadata.deb]
maintainer = "Code Cutter Limited <hello@codecutter.io>"
copyright = "2026, Code Cutter Limited"
license-file = ["LICENSE", "0"]
extended-description = """Like sl, but the picture changes with the news. artsl rolls a piece of
console art across the terminal: a built-in picture on first run, then the
picture of the day from mailbuttons.com, drawn each morning by an LLM from
the headlines. Subscribers can have one drawn on the spot."""
section = "games"
priority = "optional"
assets = [
  ["target/release/artsl", "usr/bin/", "755"],
  ["README.md", "usr/share/doc/artsl/", "644"],
  ["target/completions/artsl.bash", "usr/share/bash-completion/completions/artsl", "644"],
  ["target/completions/_artsl", "usr/share/zsh/vendor-completions/", "644"],
  ["target/completions/artsl.fish", "usr/share/fish/vendor_completions.d/", "644"],
  ["target/man/artsl.1", "usr/share/man/man1/", "644"],
]

[dev-dependencies]
tempfile = "3"
