# http-level directives for the artsl art service. Installed by
# deploy/deploy.sh as /etc/nginx/conf.d/artsl-zones.conf.
limit_req_zone $binary_remote_addr zone=art_public:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=art_write:10m  rate=6r/m;
proxy_cache_path /var/cache/nginx/art levels=1 keys_zone=art:1m max_size=50m inactive=1h;
