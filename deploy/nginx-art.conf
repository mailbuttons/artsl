# Drop into the mailbuttons.com server block (deployment/nginx/mailbuttons.com)
# ahead of `location /api/`. Everything artsl needs lives under /art/.
location /art/ {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Drawing a picture on demand takes a while.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# If you use the publish timer instead of `artsl serve`, replace the block
# above with static serving and skip on-demand drawing:
