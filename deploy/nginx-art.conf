# Drop into the mailbuttons.com server block (deployment/nginx/mailbuttons.com)
# ahead of `location /api/`. Everything artsl needs lives under /art/.
#
# The two limit_req zones go in the http {} block (nginx.conf or a conf.d
# snippet), not inside server {}:
#
#   limit_req_zone $binary_remote_addr zone=art_public:10m rate=30r/m;
#   limit_req_zone $binary_remote_addr zone=art_write:10m  rate=6r/m;
#
# The public picture is cached by nginx for five minutes, so a crowd of
# clients at the same moment costs the service one request.
#
#   proxy_cache_path /var/cache/nginx/art levels=1 keys_zone=art:1m max_size=50m inactive=1h;

location = /art/latest.json {
    limit_req zone=art_public burst=20 nodelay;
    proxy_cache art;
    proxy_cache_valid 200 304 5m;
    proxy_cache_use_stale error timeout updating http_500 http_502 http_503;
    proxy_cache_lock on;
    add_header X-Cache $upstream_cache_status;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /art/archive/ {
    limit_req zone=art_public burst=20 nodelay;
    proxy_cache art;
    proxy_cache_valid 200 1d;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /art/v1/subscribe {
    # Each call costs mailbuttons an authenticated request; keep it slow.
    limit_req zone=art_write burst=3 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
}

location /art/v1/generate {
    limit_req zone=art_write burst=3 nodelay;
    client_max_body_size 4k;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Drawing a picture on demand takes a while.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

location /art/v1/admin/ {
    # Operators only. Reach it over the loopback or a VPN; never the internet.
    deny all;
}

location /art/ {
    limit_req zone=art_public burst=20 nodelay;
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
